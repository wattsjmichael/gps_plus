[project]
name = "forevervoice-helper"
version = "0.4.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "faster-whisper>=1.2.0",
  "numpy>=1.26",
  "pynput>=1.7.7",
  "sounddevice>=0.5.0",
  "pystray>=0.19.5",
  "Pillow>=10.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0",
]

[tool.setuptools]
py-modules = ["forevervoice", "fv_runtime", "fv_desktop"]
